<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光谱</title>
<style>
:root{
  --barrel:#0b0c0e; --graphite:#17181b; --graphite-2:#1f2125; --graphite-3:#2a2c31;
  --ivory:#ece7db; --paint:#9a968c; --dim:#605e58; --index:#ff8a3c;
  --rule:rgba(236,231,219,.10); --rule-2:rgba(236,231,219,.18);
  --sans:"Avenir Next","Avenir","Futura","Century Gothic","Segoe UI",system-ui,sans-serif;
  --bar-h:46px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:var(--ivory);font:500 12.5px/1.3 var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums lining-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,.sl:focus-visible{outline:1px solid var(--index);outline-offset:2px}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
#ov{touch-action:none;transition:opacity .26s ease}
#ov.fade{opacity:0}

/* ---------- top bar ---------- */
#bar{position:fixed;left:0;right:0;top:0;height:var(--bar-h);display:flex;align-items:stretch;z-index:20;
  background:rgba(19,20,23,.9);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);
  border-bottom:1px solid var(--rule)}
#bar>*{display:flex;align-items:center}
.brand{padding:0 18px 0 16px;gap:10px;font-weight:600;font-size:14px;letter-spacing:.06em;border-right:1px solid var(--rule)}
.brand svg{width:20px;height:20px}
.mode{position:relative;border-right:1px solid var(--rule)}
.mode button{height:100%;padding:0 18px;color:var(--paint);font-weight:600;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:1px;transition:color .25s}
.mode button b{font-size:13px;font-weight:600;letter-spacing:.03em}
.mode button span{font-size:10.5px;font-weight:500;opacity:.75}
.mode button.on{color:var(--ivory)}
.mode .tick{position:absolute;bottom:-1px;height:2px;background:var(--index);left:0;width:0;transition:left .45s cubic-bezier(.6,0,.2,1),width .45s cubic-bezier(.6,0,.2,1)}
.mode .tick::after{content:"";position:absolute;left:50%;bottom:2px;margin-left:-4px;border:4px solid transparent;border-bottom-color:var(--index);border-top:0}
.menu{position:relative;border-right:1px solid var(--rule)}
.menu-btn{height:100%;padding:0 14px 0 16px;display:flex;align-items:center;gap:10px}
.menu-btn small{font-size:10.5px;color:var(--paint);font-weight:500}
.menu-btn b{font-weight:600;font-size:12.5px;min-width:128px;text-align:left}
.menu-btn svg{width:9px;height:9px;opacity:.6;transition:transform .2s}
.menu.open .menu-btn svg{transform:rotate(180deg)}
.menu-pop{position:absolute;top:calc(100% + 1px);left:-1px;min-width:270px;background:var(--graphite);border:1px solid var(--rule-2);border-top:0;
  box-shadow:0 18px 40px rgba(0,0,0,.6);opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .16s,transform .16s}
.menu.open .menu-pop{opacity:1;transform:none;pointer-events:auto}
.menu-pop button{display:block;width:100%;text-align:left;padding:10px 16px 10px 16px;border-top:1px solid var(--rule);position:relative}
.menu-pop button b{display:block;font-weight:600;font-size:12.5px}
.menu-pop button span{display:block;font-size:11px;color:var(--paint);margin-top:2px;line-height:1.35}
.menu-pop button:hover{background:var(--graphite-2)}
.menu-pop button.on::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--index)}
.grow{flex:1}
.hist{padding:0 6px;gap:2px;border-left:1px solid var(--rule);transition:opacity .25s}
.hist.off{opacity:0;pointer-events:none;width:0;padding:0;border:0;overflow:hidden}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:3px;color:var(--paint)}
.ib:hover{background:var(--graphite-2);color:var(--ivory)}
.ib:disabled{opacity:.3;pointer-events:none}
.ib svg{width:16px;height:16px}
.stats{border-left:1px solid var(--rule);padding:0 4px}
.stat{padding:0 14px;display:flex;flex-direction:column;align-items:flex-end;min-width:74px}
.stat+.stat{border-left:1px solid var(--rule)}
.stat b{font-size:14px;font-weight:600;letter-spacing:.01em;line-height:1.15;white-space:nowrap}
.stat span{font-size:10.5px;color:var(--paint);line-height:1.2;white-space:nowrap}
#shot{padding:0 18px 0 14px;gap:9px;font-weight:600;white-space:nowrap;border-left:1px solid var(--rule);transition:background .15s}
#shot:hover{background:var(--graphite-2)}
#shot svg{width:17px;height:17px}

/* ---------- floating panel ---------- */
#panel{position:fixed;right:12px;top:calc(var(--bar-h) + 12px);width:292px;max-height:calc(100vh - var(--bar-h) - 24px);z-index:15;display:flex;flex-direction:column;
  background:rgba(23,24,27,.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--rule-2);border-radius:4px;
  box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04)}
.p-head{display:flex;align-items:center;height:34px;flex:none;cursor:grab;border-bottom:1px solid var(--rule)}
.p-head:active{cursor:grabbing}
.knurl{width:34px;align-self:stretch;border-right:1px solid var(--rule);
  background:repeating-linear-gradient(90deg,rgba(236,231,219,.16) 0 1px,transparent 1px 4px);background-position:9px 0;background-size:17px 100%;background-repeat:no-repeat;
  -webkit-mask:linear-gradient(#000 0 0) center/100% 12px no-repeat;mask:linear-gradient(#000 0 0) center/100% 12px no-repeat}
.p-title{flex:1;padding:0 12px;font-weight:600;font-size:12.5px;letter-spacing:.02em}
#collapse{width:34px;height:33px;display:grid;place-items:center;color:var(--paint);border-left:1px solid var(--rule)}
#collapse svg{width:10px;height:10px;transition:transform .25s}
#panel.shut #collapse svg{transform:rotate(180deg)}
.p-wrap{position:relative;overflow:hidden;flex:1;min-height:0;display:flex}
#panel.shut .p-wrap{display:none}
.p-body{overflow-y:auto;overflow-x:hidden;width:100%;padding:2px 0 10px;transition:opacity .3s ease,transform .45s cubic-bezier(.6,0,.2,1)}
.p-body.gone{position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateX(18px)}
.p-body::-webkit-scrollbar{width:8px}
.p-body::-webkit-scrollbar-thumb{background:var(--graphite-3);border:2px solid transparent;background-clip:content-box;border-radius:4px}
.sec{padding:12px 14px 4px}
.sec+.sec{border-top:1px solid var(--rule);margin-top:8px}
.sec>h3{font-size:11.5px;font-weight:600;color:var(--paint);margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.sec>h3 em{font-style:normal;color:var(--ivory);font-weight:500}
.ctl{margin-bottom:11px}
.ctl-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.ctl-label{color:var(--ivory)}
.ctl-val{color:var(--paint);font-size:12px}
/* slider drawn as an engraved scale with an index mark */
.sl{position:relative;height:20px;cursor:ew-resize;touch-action:none;--t:50%}
.sl-ticks,.sl-hi{position:absolute;left:0;right:0;bottom:2px;height:11px;
  background:
   repeating-linear-gradient(90deg,currentColor 0,currentColor 1px,transparent 1px,transparent calc((100% - 1px)/4)) bottom/100% 11px no-repeat,
   repeating-linear-gradient(90deg,currentColor 0,currentColor 1px,transparent 1px,transparent calc((100% - 1px)/40)) bottom/100% 5px no-repeat}
.sl-ticks{color:rgba(236,231,219,.2)}
.sl-hi{color:rgba(236,231,219,.85);clip-path:inset(0 calc(100% - var(--t)) 0 0)}
.sl-band{position:absolute;left:0;right:0;top:2px;height:5px;border-radius:1px;display:none}
.sl.grad .sl-band{display:block}
.sl.grad .sl-ticks,.sl.grad .sl-hi{height:8px;background-size:100% 8px,100% 4px}
.sl.grad .sl-hi{color:rgba(236,231,219,.2);clip-path:none}
.sl-index{position:absolute;top:0;bottom:0;left:var(--t);width:2px;margin-left:-1px;background:var(--index);border-radius:1px;transition:transform .12s}
.sl-index::before{content:"";position:absolute;left:-3px;top:-1px;border:4px solid transparent;border-top-color:var(--index);border-bottom:0}
.sl:hover .sl-index,.sl.drag .sl-index{transform:scaleX(1.5)}
.seg{display:flex;border:1px solid var(--rule-2);border-radius:3px;overflow:hidden}
.seg button{flex:1;padding:6px 4px;color:var(--paint);position:relative;font-size:12px}
.seg button+button{border-left:1px solid var(--rule)}
.seg button.on{color:var(--ivory);background:var(--graphite-2)}
.seg button.on::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:2px;background:var(--index)}
.sw{display:flex;gap:7px;flex-wrap:wrap}
.sw button{width:22px;height:22px;border-radius:2px;border:1px solid rgba(255,255,255,.22);position:relative}
.sw button.on{outline:1.5px solid var(--ivory);outline-offset:2px}
.row{display:flex;gap:6px;margin-bottom:11px}
.btn{flex:1;padding:7px 8px;border:1px solid var(--rule-2);border-radius:3px;color:var(--ivory);font-size:12px;text-align:center}
.btn:hover{background:var(--graphite-2)}
.btn:disabled{opacity:.35;pointer-events:none}
.note{color:var(--paint);font-size:11.5px;line-height:1.5;margin-bottom:10px}
.note kbd{font:inherit;color:var(--ivory);border:1px solid var(--rule-2);border-radius:2px;padding:0 4px;margin:0 1px}

/* ---------- 2D tool dock ---------- */
#dock{position:fixed;left:12px;top:calc(var(--bar-h) + 12px);width:44px;z-index:15;background:rgba(23,24,27,.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--rule-2);border-radius:4px;box-shadow:0 24px 60px rgba(0,0,0,.55);padding:3px 0;
  transition:transform .5s cubic-bezier(.6,0,.2,1),opacity .35s;max-height:calc(100vh - var(--bar-h) - 24px);overflow:visible}
#dock.off{transform:translateX(-70px);opacity:0;pointer-events:none}
#dock button{width:42px;height:35px;display:grid;place-items:center;color:var(--paint);position:relative}
#dock button svg{width:20px;height:20px}
#dock button:hover{color:var(--ivory)}
#dock button.on{color:var(--ivory);background:var(--graphite-2)}
#dock button.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;background:var(--index)}
#dock hr{border:0;border-top:1px solid var(--rule);margin:3px 0}
#dock button::after{content:attr(data-tip);position:absolute;left:50px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--graphite);border:1px solid var(--rule-2);
  padding:5px 9px;border-radius:3px;font-size:11.5px;color:var(--ivory);opacity:0;pointer-events:none;transition:opacity .12s .25s}
#dock button:hover::after{opacity:1}
@media (max-height:760px){#dock button{height:30px}}

#hint{position:fixed;left:14px;bottom:12px;z-index:10;color:var(--paint);font-size:11.5px;text-shadow:0 1px 3px #000;transition:opacity .3s;pointer-events:none;max-width:60vw}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);z-index:30;background:var(--graphite);border:1px solid var(--rule-2);border-radius:3px;padding:8px 14px;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40}
#flash.on{animation:fl .32s ease-out}
@keyframes fl{0%{opacity:.35}100%{opacity:0}}
#fatal{position:fixed;inset:0;display:none;place-items:center;z-index:50;background:#000;padding:40px}
#fatal div{max-width:560px;font-size:14px;line-height:1.6}
#fatal pre{margin-top:14px;color:var(--paint);font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;user-select:text;-webkit-user-select:text;max-height:50vh;overflow:auto}
@media (max-width:1180px){.brand span,.menu-btn small,.mode button span{display:none}.stat{min-width:60px;padding:0 9px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>

<header id="bar">
  <div class="brand">
    <svg viewBox="0 0 20 20" fill="none"><path d="M10 3.2 17 15.8H3z" stroke="#ece7db" stroke-width="1.3" stroke-linejoin="round"/><path d="M0 12.2 7.4 9.6" stroke="#ece7db" stroke-width="1.1"/><path d="M11.9 9.3 20 10.6" stroke="#ff5a5a" stroke-width="1.1"/><path d="M12.2 10.3 20 12.6" stroke="#ffd24a" stroke-width="1.1"/><path d="M12.5 11.3 20 14.6" stroke="#5fd08a" stroke-width="1.1"/><path d="M12.8 12.3 20 16.6" stroke="#5b8cff" stroke-width="1.1"/></svg>
    <span>光谱</span>
  </div>
  <div class="mode" id="mode">
    <button data-m="3d" class="on"><b>三维</b><span>光路追踪</span></button>
    <button data-m="2d"><b>平面</b><span>光学台</span></button>
    <i class="tick"></i>
  </div>
  <div class="menu" id="preset">
    <button class="menu-btn"><small>预设</small><b id="presetName"></b><svg viewBox="0 0 10 10"><path d="M1 3l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <div class="menu-pop" id="presetPop"></div>
  </div>
  <div class="grow"></div>
  <div class="hist off" id="hist">
    <button class="ib" id="undo" title="撤销"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5.5 3 2.5 6l3 3"/><path d="M2.5 6h6.5a4 4 0 0 1 0 8H6"/></svg></button>
    <button class="ib" id="redo" title="重做"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10.5 3l3 3-3 3"/><path d="M13.5 6H7a4 4 0 0 0 0 8h3"/></svg></button>
  </div>
  <div class="stats">
    <div class="stat"><b id="st1">0</b><span id="st1l">每像素采样</span></div>
    <div class="stat"><b id="st2">0.0 ms</b><span>帧时间</span></div>
    <div class="stat"><b id="st3">100%</b><span>分辨率</span></div>
  </div>
  <button id="shot" title="保存当前画面"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 5.5h3l1.2-2h4.6l1.2 2h3v9h-13z" stroke-linejoin="round"/><circle cx="9" cy="9.8" r="2.7"/></svg>保存图片</button>
</header>

<aside id="dock" class="off"></aside>

<aside id="panel">
  <div class="p-head" id="phead"><i class="knurl"></i><div class="p-title" id="ptitle">光路追踪</div><button id="collapse" title="收起面板"><svg viewBox="0 0 10 10"><path d="M1 7l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button></div>
  <div class="p-wrap"><div class="p-body" id="p3d"></div><div class="p-body gone" id="p2d"></div></div>
</aside>

<div id="hint"></div>
<div id="toast"></div>
<div id="flash"></div>
<div id="fatal"><div><b id="fatalTitle"></b><pre id="fatalMsg"></pre></div></div>

<script>
(() => {
'use strict';
/* =====================================================================================
   Spectra: light-physics playground
   -------------------------------------------------------------------------------------
   Layout of this file
     1. Core utilities, colour science (JS mirror of the GLSL pipeline), WebGL helpers
     2. Shared GLSL: spectral sampling, CIE matching, dispersion, Fresnel, tone mapping
     3. UI kit: custom slider / segmented control / swatches
     4. Mode3D: progressive spectral path tracer + photon-mapped caustics
     5. Mode2D: GPU spectral light table + editor
     6. App shell: top bar, mode transition, stats, screenshot, main loop
   ===================================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* ---------- colour science ---------------------------------------------------------- */
const LMIN = 380, LMAX = 700;
const Color = (() => {
  const g = (l, mu, s1, s2) => { const t = (l - mu) * (l < mu ? s1 : s2); return Math.exp(-0.5 * t * t); };
  // CIE 1931 2-degree observer, multi-lobe Gaussian fit (Wyman, Sloan & Shirley 2013)
  const xyz = l => [
    0.362 * g(l, 442.0, 0.0624, 0.0374) + 1.056 * g(l, 599.8, 0.0264, 0.0323) - 0.065 * g(l, 501.1, 0.0490, 0.0382),
    0.821 * g(l, 568.8, 0.0213, 0.0247) + 0.286 * g(l, 530.9, 0.0613, 0.0322),
    1.217 * g(l, 437.0, 0.0845, 0.0278) + 0.681 * g(l, 459.0, 0.0385, 0.0725)];
  const toRGB = ([x, y, z]) => [3.2404542 * x - 1.5371385 * y - 0.4985314 * z, -0.9692660 * x + 1.8760108 * y + 0.0415560 * z, 0.0556434 * x - 0.2040259 * y + 1.0572252 * z];
  const rgb = l => toRGB(xyz(l));
  // Planck's law, normalised to 1 at 560 nm so the numbers stay in float range
  const planck = (l, T) => Math.pow(560 / l, 5) * (Math.exp(1.4388e7 / (560 * T)) - 1) / (Math.exp(1.4388e7 / (l * T)) - 1);
  const kCache = new Map();
  // normalisation so a blackbody at T integrates to luminance Y = 1
  const K = T => { T = Math.round(T); if (!kCache.has(T)) { let s = 0; for (let l = LMIN; l <= LMAX; l++) s += xyz(l)[1] * planck(l, T); kCache.set(T, 1 / s); } return kCache.get(T); };
  const whiteE = (() => { const s = [0, 0, 0]; for (let l = LMIN; l <= LMAX; l++) { const c = rgb(l); s[0] += c[0]; s[1] += c[1]; s[2] += c[2]; } return s; })();
  const fix = c => { // desaturate towards luminance until in gamut
    const Y = Math.max(0, 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]), m = Math.min(c[0], c[1], c[2]);
    if (m < 0) { const k = Y / (Y - m + 1e-9); c = c.map(v => Y + (v - Y) * k); }
    return c.map(v => Math.max(0, v));
  };
  const enc = v => Math.round(255 * clamp(v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055, 0, 1));
  const css = (c, a = 1) => { const m = Math.max(c[0], c[1], c[2], 1e-6); return `rgba(${enc(c[0] / m)},${enc(c[1] / m)},${enc(c[2] / m)},${a})`; };
  const tempRGB = T => { const s = [0, 0, 0]; for (let l = LMIN; l <= LMAX; l += 2) { const c = rgb(l), p = planck(l, T); s[0] += c[0] * p; s[1] += c[1] * p; s[2] += c[2] * p; } return fix(s); };
  const waveCSS = (l, a = 1) => css(fix(rgb(l)), a);
  const tempCSS = (T, a = 1) => css(tempRGB(T), a);
  const gradient = (fn, a, b, n = 14) => 'linear-gradient(90deg,' + Array.from({ length: n + 1 }, (_, i) => fn(a + (b - a) * i / n)).join(',') + ')';
  return { xyz, rgb, planck, K, whiteE, fix, waveCSS, tempCSS, gradient, lum: l => xyz(l)[1] };
})();

/* ---------- WebGL helpers ----------------------------------------------------------- */
const glCanvas = $('#gl'), ovCanvas = $('#ov');
const gl = glCanvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance', preserveDrawingBuffer: false });
const GLX = {};
function fatal(title, msg) {
  $('#fatal').style.display = 'grid'; $('#fatalTitle').textContent = title; $('#fatalMsg').textContent = msg || '';
  throw new Error(title + (msg ? '\n' + msg : ''));
}
if (!gl) fatal('WebGL2 is not available in this browser.', 'Spectra needs WebGL2 with floating-point render targets. A current Chrome or Safari on a Mac has both.');
if (!gl.getExtension('EXT_color_buffer_float')) fatal('This GPU cannot render to floating-point textures.', 'The EXT_color_buffer_float extension is missing.');
GLX.floatBlend = !!gl.getExtension('EXT_float_blend');
// Accumulation format: 32-bit float when it can be blended, otherwise 16-bit (always blendable).
GLX.ACC = GLX.floatBlend ? gl.RGBA32F : gl.RGBA16F;
GLX.ACC_T = GLX.floatBlend ? gl.FLOAT : gl.HALF_FLOAT;

function compileShader(type, src, name) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s) || '';
    const numbered = src.split('\n').map((l, i) => String(i + 1).padStart(4) + '  ' + l).join('\n');
    console.error('Shader compile failed: ' + name + '\n' + log + '\n' + numbered);
    fatal('A shader failed to compile (' + name + ').', log);
  }
  return s;
}
function program(vs, fs, name) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vs, name + '.vert'));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fs, name + '.frag'));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fatal('A shader failed to link (' + name + ').', gl.getProgramInfoLog(p));
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);

/* =====================================================================================
   5. Mode2D shaders
   Ray state lives in two float textures:  pos = (x, y, dir.x, dir.y)
                                           col = (wavelength, throughput after the last event, intensity on arrival, alive)
   ===================================================================================== */
const MAXP = 160;         // primitives (segments + arcs) in the scene texture
const MAXL = 8;           // lights
const RAY_W = 1024;       // ray-state texture width

// Emit one ray per texel from the lights.
const FS_INIT2D = GLSL_HEAD + GLSL_SPECTRAL + GLSL_RNG + `
uniform uint uFrame; uniform int uLightN; uniform vec4 uL0[${MAXL}],uL1[${MAXL}],uL2[${MAXL}];
layout(location=0) out vec4 oPos; layout(location=1) out vec4 oCol;
void main(){
  ivec2 ip=ivec2(gl_FragCoord.xy); seed(ip,uFrame);
  oPos=vec4(0.0); oCol=vec4(550.0,0.0,0.0,0.0);
  if(uLightN==0) return;
  float u=rnd(); int k=uLightN-1; for(int i=0;i<uLightN;i++){ if(u<uL1[i].w){ k=i; break; } }
  vec4 a=uL0[k],b=uL1[k],c=uL2[k]; int type=int(b.x+0.5);
  vec2 dir=a.zw,pos=a.xy; float lam,w;
  if(type==3){ lam=c.x+(rnd()-0.5)*3.0; w=c.y; }                                    // monochromatic laser
  else { lam=sampleLambda(rnd()); w=planck(lam,c.x)*c.y/pdfLambda(lam); }           // blackbody white
  if(type==2){ float an=6.2831853*rnd(); dir=vec2(cos(an),sin(an)); }               // point light
  else {
    pos+=vec2(-dir.y,dir.x)*(rnd()-0.5)*b.y;                                        // aperture width
    float sp=(rnd()-0.5)*b.z,cs=cos(sp),sn=sin(sp); dir=vec2(dir.x*cs-dir.y*sn,dir.x*sn+dir.y*cs);   // cone spread
  }
  oPos=vec4(pos,dir); oCol=vec4(lam,w,w,1.0);
}`;

// Advance every ray to its next surface and apply the interaction there.
const FS_TRACE2D = GLSL_HEAD + GLSL_SPECTRAL + GLSL_RNG + `
uniform sampler2D uPos,uCol,uScene; uniform int uCount; uniform uint uFrame; uniform float uBias;
layout(location=0) out vec4 oPos; layout(location=1) out vec4 oCol;
const float EPS=0.02, FAR=1e5;
float cross2(vec2 a,vec2 b){ return a.x*b.y-a.y*b.x; }
void main(){
  ivec2 ip=ivec2(gl_FragCoord.xy); seed(ip,uFrame);
  vec4 P=texelFetch(uPos,ip,0),C=texelFetch(uCol,ip,0);
  vec2 o=P.xy,d=P.zw; float lam=C.x,thr=C.y;
  if(thr<=0.0){ oPos=P; oCol=vec4(lam,0.0,0.0,0.0); return; }
  float tB=FAR; int hit=-1; vec2 n=vec2(0.0);
  for(int i=0;i<uCount;i++){
    vec4 A=texelFetch(uScene,ivec2(i,0),0),B=texelFetch(uScene,ivec2(i,1),0);
    if(B.w<0.5){ // segment a -> b, stored normal
      vec2 e=A.zw-A.xy,w=o-A.xy; float den=cross2(d,e); if(abs(den)<1e-9) continue;
      float t=cross2(e,w)/den,s=cross2(d,w)/den;
      if(t>EPS&&t<tB&&s>=0.0&&s<=1.0){ tB=t; hit=i; n=B.xy; }
    } else {     // arc: centre, radius, orientation sign; B = mid direction, cos(half span)
      vec2 oc=o-A.xy; float b=dot(oc,d),c=dot(oc,oc)-A.z*A.z,h=b*b-c; if(h<=0.0) continue; h=sqrt(h);
      float t=-b-h;
      if(t>EPS&&t<tB){ vec2 q=(oc+t*d)/A.z; if(dot(q,B.xy)>=B.z){ tB=t; hit=i; n=q*A.w; } }
      t=-b+h;
      if(t>EPS&&t<tB){ vec2 q=(oc+t*d)/A.z; if(dot(q,B.xy)>=B.z){ tB=t; hit=i; n=q*A.w; } }
    }
  }
  vec2 p=o+d*tB;
  if(hit<0){ oPos=vec4(p,d); oCol=vec4(lam,0.0,thr,0.0); return; }
  vec4 M=texelFetch(uScene,ivec2(hit,2),0),K=texelFetch(uScene,ivec2(hit,3),0);
  int mat=int(M.x+0.5); float arrive=thr,nt=0.0; vec2 nd=d;
  if(mat==0){ // glass
    bool ent=dot(d,n)<0.0; vec2 nn=ent?n:-n;
    if(!ent&&M.w>0.0) arrive*=pow(max(rgbToSpec(K.rgb,lam),0.02),M.w*tB*0.01);   // Beer-Lambert over the path inside
    float ng=iorAt(M.y,M.z,lam),eta=ent?1.0/ng:ng,ci=-dot(d,nn),ct; float F=fresnel(ci,eta,ct);
    // sample reflection a little more often than Fresnel says, so faint internal bounces (rainbows) resolve quickly
    float pr=F>=1.0?1.0:mix(F,0.5,uBias);
    if(rnd()<pr){ nd=reflect(d,nn); nt=arrive*F/pr; }
    else { nd=normalize(eta*d+(eta*ci-ct)*nn); nt=arrive*(1.0-F)/(1.0-pr); }
  } else if(mat==1){ nd=reflect(d,n); nt=arrive*K.w; }                               // mirror
  else if(mat==3){ // diffuse: cosine-weighted scatter back to the incoming side
    vec2 nn=dot(d,n)<0.0?n:-n; float s=rnd()*2.0-1.0; nd=nn*sqrt(max(0.0,1.0-s*s))+vec2(-nn.y,nn.x)*s; nt=arrive*K.w;
  }
  oPos=vec4(p,nd); oCol=vec4(lam,nt,arrive,1.0);
}`;

// Draw every ray segment as a line; colour comes from its wavelength.
const VS_LINES2D = GLSL_HEAD + GLSL_SPECTRAL + `
uniform sampler2D uPosA,uPosB,uColA,uColB; uniform vec4 uView; uniform vec2 uRes; uniform uint uFrame;
out vec3 vCol;
uint h32(uint v){ uint s=v*747796405u+2891336453u; uint w=((s>>((s>>28u)+4u))^s)*277803737u; return (w>>22u)^w; }
void main(){
  int ray=gl_VertexID>>1,en=gl_VertexID&1; ivec2 tc=ivec2(ray%${RAY_W},ray/${RAY_W});
  vec4 ca=texelFetch(uColA,tc,0);
  if(ca.y<=0.0){ gl_Position=vec4(2.0,2.0,0.0,1.0); vCol=vec3(0.0); return; }
  vec4 pa=texelFetch(uPosA,tc,0),pb=texelFetch(uPosB,tc,0),cb=texelFetch(uColB,tc,0);
  vec2 a=(pa.xy-uView.xy)*uView.zw,b=(pb.xy-uView.xy)*uView.zw;
  vec2 dp=(b-a)*0.5*uRes; float ln=length(dp);
  float bias=ln>0.0?ln/max(abs(dp.x),abs(dp.y)):1.0;          // a diagonal line covers fewer pixels per unit length
  uint hh=h32(uint(ray)+h32(uFrame)); vec2 jit=(vec2(float(hh&65535u),float(hh>>16u))/65535.0-0.5)*2.0/uRes;   // sub-pixel jitter = antialiasing
  vCol=wavelengthRGB(ca.x)*((en==0?ca.y:cb.z)*bias);
  gl_Position=vec4((en==0?a:b)+jit,0.0,1.0);
}`;
const FS_LINES2D = GLSL_HEAD + `in vec3 vCol; out vec4 o; void main(){ o=vec4(vCol,1.0); }`;

const FS_DISPLAY2D = GLSL_HEAD + GLSL_DISPLAY + `
uniform sampler2D uAccum,uBloom; uniform vec2 uSub; uniform float uNorm,uBloomAmt,uAlpha,uZoom,uPxW;
uniform vec2 uViewC,uViewH;   // world centre and half-extent of the view
in vec2 vUv; out vec4 o;
void main(){
  vec2 uv=(vUv-0.5)/uZoom+0.5;
  if(any(lessThan(uv,vec2(0.0)))||any(greaterThan(uv,vec2(1.0)))){ o=vec4(0.0,0.0,0.0,uAlpha); return; }
  vec3 c=bilin(uAccum,uv*uSub,ivec2(uSub)-1).rgb*uNorm;
  c=gamutFix(c)+bloom(uBloom,uv)*uBloomAmt;
  c=aces(c);
  // the table: faint cool falloff and a dot grid every 50 units
  vec2 q=uv-0.5; c+=vec3(0.010,0.012,0.016)*(1.0-smoothstep(0.1,0.9,length(q)*1.3));
  vec2 wp=uViewC+vec2(q.x,-q.y)*2.0*uViewH; vec2 g=(fract(wp/50.0+0.5)-0.5)*50.0;
  vec2 g2=(fract(wp/250.0+0.5)-0.5)*250.0;
  c+=vec3(0.055,0.058,0.065)*(1.0-smoothstep(0.7,1.5,length(g)/uPxW))+vec3(0.06)*(1.0-smoothstep(1.2,2.0,length(g2)/uPxW));
  c=toSRGB(c)+(ign(gl_FragCoord.xy)-0.5)/255.0;
  o=vec4(c,uAlpha);
}`;

    c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `spectra-${cur.id}-${stamp}.png`; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); }, 'image/png');
    const f = $('#flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); toast('Saved PNG');
  }

  /* ---- main loop ---- */
  function frame(t) {
    requestAnimationFrame(frame);
    const dt = Math.min(t - lastT, 250); lastT = t; Shell.ft += (dt - Shell.ft) * 0.12;
    cur.update(dt);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, Shell.W, Shell.H); gl.disable(gl.BLEND);
    if (trans) { // cross-dissolve with a slight push-in: the outgoing mode keeps showing its last accumulated frame
      const k = ease(clamp((t - trans.t0) / trans.dur, 0, 1));
      trans.from.display(1, 1 + 0.14 * k);
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA); trans.to.display(k, 1.14 - 0.14 * k); gl.disable(gl.BLEND);
      if (k >= 1) trans = null;
    } else cur.display(1, 1);
    if (wantShot) { wantShot = false; if (!trans) shoot(); }
    const dpr = ovCanvas.width / Shell.cssW; octx.setTransform(dpr, 0, 0, dpr, 0, 0); octx.clearRect(0, 0, Shell.cssW, Shell.cssH); ovMode.overlay(octx);
    if (t - statT > 160) { statT = t; const s = cur.stats(); $('#st1').textContent = s.v; $('#st1l').textContent = s.l; $('#st2').textContent = Shell.ft.toFixed(1) + ' ms'; $('#st3').textContent = Math.round(s.scale * 100) + '%'; }
  }

  Mode3D.init(); Mode2D.init(); resize(); Mode2D.fitView(); syncBar();
  requestAnimationFrame(frame);
  return { switchMode, get mode() { return cur.id; }, shoot: () => { wantShot = true; }, syncBar };
})();
window.__spectra = { App, Mode3D, Mode2D, Shell };

})();
